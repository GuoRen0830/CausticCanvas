<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Beam renderer checks</title>
<body><pre id="output">Running beam checks...</pre>
<script type="module">
  import { checkBeams } from './beam-check.ts'
  const log = document.querySelector('#output')
  const report = line => { log.textContent += '\n' + line }
  try {
    const adapter = await navigator.gpu.requestAdapter()
    const device = await adapter.requestDevice()
    device.pushErrorScope('validation')
    try {
      await checkBeams(device, report)
      const error = await device.popErrorScope()
      if (error) throw new Error(error.message)
      report('ALL PASSED')
    } finally { device.destroy() }
  } catch (error) { report(String(error)); console.error(error) }
</script></body></html>
