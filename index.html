<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caustic Canvas</title>
  </head>

  <body>
    <div id="app">
      <header>
        <h1>Caustic Canvas</h1>
        <p id="status">Initializing WebGPU…</p>
      </header>

      <main id="workspace">
        <aside id="design-panel">
          <h2>Design the light</h2>
          <p>Draw a pattern with the white brush.</p>

          <canvas id="target-canvas" aria-label="Light pattern drawing pad"></canvas>

          <button id="clear-target" type="button">Clear</button>
          <p id="target-status">Draw a pattern to begin.</p>

          <section id="caustic-panel">
            <h2>Caustic result</h2>
            <canvas
              id="caustic-canvas"
              aria-label="Receiver irradiance preview"
            ></canvas>
            <p id="caustic-status">Waiting for solver output.</p>
          </section>
        </aside>

        <section id="viewport">
          <div id="beam-control">
            <label>Light source
              <select id="beam-source">
                <option value="solver">Solver beams</option>
                <option value="single">Single test beam</option>
                <option value="pair">Two overlapping beams</option>
              </select>
            </label>
            <label>Scene lighting
              <select id="scene-method">
                <option value="first-hit">BVH first hit</option>
                <option value="analytic">Box reference</option>
              </select>
            </label>
            <label>View
              <select id="beam-view">
                <option value="lit">Lit scene</option>
                <option value="candidates">Candidate pixels</option>
                <option value="footprint">Floor footprint</option>
                <option value="blocked">Blocked irradiance (box reference)</option>
                <option value="plane">Receiver plane</option>
                <option value="difference">Absolute error</option>
              </select>
            </label>
          </div>
          <canvas
            id="gpu-canvas"
            aria-label="Interactive scene preview"
            aria-describedby="camera-help"
          ></canvas>
          <p id="camera-help">Drag to orbit · Scroll to zoom · Double-click to reset</p>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
