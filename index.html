<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caustic Canvas</title>
  </head>

  <body>
    <div id="app">
      <section id="viewport">
        <canvas
          id="gpu-canvas"
          aria-label="Interactive scene preview"
          aria-describedby="camera-help"
        ></canvas>
      </section>

      <header id="topbar">
        <h1>Caustic Canvas</h1>
        <div class="scene-picker">
          <select id="bundled-scene" aria-label="Scene" disabled>
            <option value="" hidden>Choose a scene</option>
          </select>
          <button id="import-obj" class="quiet" type="button" title="Open an OBJ with its MTL and textures" disabled>Open OBJ</button>
          <input id="obj-file" type="file" accept=".obj,.mtl,.png,.jpg,.jpeg,.webp" multiple hidden />
          <button id="import-folder" class="quiet" type="button" title="Open a folder with the OBJ, MTL and Base Color images" disabled>Open folder</button>
          <input id="asset-folder" type="file" webkitdirectory multiple hidden />
        </div>
      </header>

      <aside id="design-panel">
        <div class="panel-head">
          <h2>Draw the light</h2>
          <p class="hint">Paint where the light should land. The view is from the lamp, looking down.</p>
        </div>

        <canvas id="target-canvas" aria-label="Light pattern drawing pad"></canvas>

        <div class="tools">
          <label class="brush" title="Brush size">
            <span>Brush</span>
            <input id="brush-size" type="range" min="0.02" max="0.12" step="0.005" value="0.05" />
          </label>
          <button id="undo-target" class="quiet" type="button" disabled>Undo</button>
          <button id="clear-target" class="quiet" type="button">Clear</button>
        </div>
        <p id="target-status" class="hint"></p>

        <div id="progress" aria-hidden="true"><span></span></div>

        <section id="caustic-panel">
          <div class="result-head">
            <h3>Result</h3>
            <p id="caustic-status" role="status"></p>
          </div>
          <canvas
            id="caustic-canvas"
            aria-label="Light reaching the scene, seen from the lamp"
          ></canvas>
        </section>
      </aside>

      <div id="view-switch" role="group" aria-label="View">
        <button type="button" data-view="lit" aria-pressed="true">Room</button>
        <button type="button" data-view="lens" aria-pressed="false">Glass</button>
        <select id="beam-view" aria-label="Debug view" hidden>
          <option value="lit">Lit scene</option>
          <option value="lens">Lens shape</option>
          <option value="candidates">Candidate pixels</option>
          <option value="footprint">Floor footprint</option>
          <option value="plane">Unobstructed plane</option>
          <option value="difference">Scene vs. plane difference</option>
        </select>
      </div>

      <footer id="footnote">
        <p id="camera-help">Drag to look around · Scroll to zoom · Double-click to reset</p>
        <p id="scene-status" role="status"></p>
        <a id="scene-credit" target="_blank" rel="noopener" hidden></a>
      </footer>

      <p id="status" role="alert"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
