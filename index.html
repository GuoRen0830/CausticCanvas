<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caustic Canvas</title>
  </head>

  <body>
    <div id="app">
      <header>
        <h1>Caustic Canvas</h1>
        <p id="status">Initializing WebGPU…</p>
      </header>

      <main id="workspace">
        <aside id="design-panel">
          <label for="bundled-scene">Scene</label>
          <select id="bundled-scene" disabled>
            <option value="" hidden>Select a scene</option>
          </select>
          <div class="scene-actions">
            <button id="import-obj" type="button" disabled>Import OBJ</button>
            <input id="obj-file" type="file" accept=".obj,.mtl,.png,.jpg,.jpeg,.webp" multiple hidden />
            <button id="import-folder" type="button" title="Select a folder containing the OBJ, MTL and Base Color images" disabled>Import folder</button>
            <input id="asset-folder" type="file" webkitdirectory multiple hidden />
          </div>
          <p id="scene-status" role="status">Loading Greer Park Skating Bowl…</p>
          <a id="scene-credit" target="_blank" rel="noopener" hidden></a>
          <h2>Design the light</h2>
          <p>Paint on the scene as seen from the light.</p>

          <canvas id="target-canvas" aria-label="Light pattern drawing pad"></canvas>

          <button id="clear-target" type="button">Clear</button>
          <p id="target-status">Draw a pattern to begin.</p>

          <section id="caustic-panel">
            <h2>Light-view irradiance</h2>
            <canvas
              id="caustic-canvas"
              aria-label="Scene irradiance from the fixed light view"
            ></canvas>
            <p id="caustic-status">Waiting for solver output.</p>
          </section>
        </aside>

        <section id="viewport">
          <div id="beam-control">
            <label>View
              <select id="beam-view">
                <option value="lit">Lit scene</option>
                <option value="lens">Lens shape</option>
                <option value="candidates">Candidate pixels</option>
                <option value="footprint">Floor footprint</option>
                <option value="plane">Unobstructed plane</option>
                <option value="difference">Scene vs. plane difference</option>
              </select>
            </label>
          </div>
          <canvas
            id="gpu-canvas"
            aria-label="Interactive scene preview"
            aria-describedby="camera-help"
          ></canvas>
          <p id="camera-help">Drag to orbit · Scroll to zoom · Double-click to reset</p>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
